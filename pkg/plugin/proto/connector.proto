syntax = "proto3";
package wick.connector.v1;
option go_package = "github.com/yogasw/wick/pkg/plugin/proto;proto";

service Connector {
  rpc Schema           (SchemaRequest)    returns (SchemaResponse);
  rpc Execute          (ExecuteRequest)   returns (ExecuteResponse);
  rpc ExecuteStream    (ExecuteRequest)   returns (stream Chunk);
  rpc CheckPermissions (PermsRequest)     returns (PermsResponse);
  rpc ResolveIdentity  (IdentityRequest)  returns (IdentityResponse);
  rpc Health           (HealthRequest)    returns (HealthResponse);
}

message Error { string code = 1; string message = 2; }

message ExecuteRequest {
  string operation = 1;
  bytes  args_json = 2;
  map<string,string> creds = 3;
  string request_id = 4;
  string session_id = 5;
  // instance_id / caller_user_id let the plugin's connector.Ctx report the
  // same InstanceID() and CallerUserID() the host sees. Empty from older hosts.
  string instance_id = 6;
  string caller_user_id = 7;
  // account_id / owner_bot_id mirror the host Ctx's AccountID() (the
  // connected account the call runs as) and OwnerBotID() (the bot that owns
  // the calling session). Empty from older hosts.
  string account_id = 8;
  string owner_bot_id = 9;
  // raw_input_json is the caller's arguments with their JSON types kept
  // (Ctx.RawInputValue); empty when the host recorded none.
  bytes raw_input_json = 10;
  // health_check asks the plugin to run the module's HealthCheck hook
  // instead of an operation. A plugin without one answers Error
  // {code:"no_health_check"}. Only sent when the manifest says
  // has_health_check, so older plugins never see it.
  bool health_check = 11;
}
// mask / mask_ignore_case carry the values the operation passed to c.Mask /
// c.MaskIgnoreCase. The plugin has no encryption key, so it returns them in
// the clear and the host turns them into wick_enc_ tokens before the result
// leaves wick.
message ExecuteResponse {
  bytes result_json = 1;
  Error error = 2;
  map<string,string> meta = 3;
  repeated string mask = 4;
  repeated string mask_ignore_case = 5;
}
message Chunk {
  bytes  data = 1;
  bool   eof = 2;
  Error  error = 3;
  int32  progress = 4;
  int32  total = 5;
  string message = 6;
  // Set on the Eof chunk only; same meaning as on ExecuteResponse.
  repeated string mask = 7;
  repeated string mask_ignore_case = 8;
}

message OpHealth { string key = 1; bool ok = 2; string reason = 3; }
message PermsRequest  { map<string,string> creds = 1; }
message PermsResponse { repeated OpHealth ops = 1; Error error = 2; }

message IdentityRequest  { string access_token = 1; }
message IdentityResponse { string user_id = 1; string display_name = 2; Error error = 3; }

message SchemaRequest  {}
message SchemaResponse { bytes manifest_json = 1; }
message HealthRequest  {}
message HealthResponse { bool healthy = 1; string detail = 2; }
