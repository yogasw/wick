name: Mesh CI
on:
  push:
    branches: [feat/wick-mesh]
  workflow_dispatch:
concurrency:
  group: mesh-ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate templates
        run: |
          go mod download
          go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)
          templ generate ./...
      - name: Build
        run: go build ./internal/... ./cmd/... ./pkg/...
      - name: Vet
        run: go vet ./internal/... ./cmd/... ./pkg/...
      - name: Unit tests
        run: go test -count=1 -timeout 15m ./internal/... ./cmd/... ./pkg/...
      - name: Race tests
        run: go test -race -count=1 -timeout 15m ./internal/... ./cmd/... ./pkg/...
  mesh-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: plugins/go.mod
          cache-dependency-path: |
            go.sum
            plugins/go.sum
      - name: Mesh plugin build
        run: go build ./plugins/service/wick_mesh/... ./plugins/connector/wick_mesh_connector/... ./plugins/tool/wick_mesh_tool/...
      - name: Mesh plugin vet
        run: go vet ./plugins/service/wick_mesh/... ./plugins/connector/wick_mesh_connector/... ./plugins/tool/wick_mesh_tool/...
      - name: Mesh unit and race tests
        run: go test -race -count=1 -timeout 5m ./plugins/service/wick_mesh/... ./plugins/connector/wick_mesh_connector/... ./plugins/tool/wick_mesh_tool/...
      - name: Repeated Mesh REST and integration tests
        run: go test -race -count=10 -timeout 5m -run 'TestPolicyREST|TestPolicyRouteRequiresHostToken|TestMutualTLS|TestPairing|TestRevisionAllDeliveryOrders|TestDurableRecovery|TestBlobResume|TestResultTransport|TestResultOnlyOfflineResume|TestPolicyHTTPSContract|TestDashboardFilter' ./plugins/service/wick_mesh/... ./plugins/connector/wick_mesh_connector/... ./plugins/tool/wick_mesh_tool/...
      - name: Mesh coverage
        run: go test -count=1 -coverprofile=mesh-coverage.out ./plugins/service/wick_mesh/... ./plugins/connector/wick_mesh_connector/... ./plugins/tool/wick_mesh_tool/... && go tool cover -func=mesh-coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-coverage
          path: mesh-coverage.out
